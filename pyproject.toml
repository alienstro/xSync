[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xsync-cli"
version = "0.3.1"
description = "Sync OpenAI-compatible models into Codex, Claude Code, OpenCode, Pi, and OMP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0", "tomlkit>=0.13"]

[project.scripts]
xsync = "xsync_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/xsync_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
